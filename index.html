<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive visual timeline of every GPT model from GPT-1 (2018) to GPT-5.4 (2026). Compare capabilities, benchmarks, pricing, and context windows.">
    <title>GPT Model Evolution Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>GPT Model Evolution Timeline</h1>
            <p class="subtitle">From GPT-1 (2018) to GPT-5.4 (2026)</p>
            <button id="theme-toggle" aria-label="Toggle dark mode">
                <span class="icon">🌙</span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="stats-section">
            <div class="stat-card">
                <h3>Total Models</h3>
                <p class="stat-value" id="total-models">14</p>
            </div>
            <div class="stat-card">
                <h3>Years Covered</h3>
                <p class="stat-value">2018 - 2026</p>
            </div>
            <div class="stat-card">
                <h3>Parameter Growth</h3>
                <p class="stat-value">117M → 1T+</p>
            </div>
        </section>

        <section class="compare-section">
            <h2>Compare Models</h2>
            <div class="compare-controls">
                <select id="compare-model-1" aria-label="Select first model">
                    <option value="">Select Model 1</option>
                </select>
                <span class="vs">VS</span>
                <select id="compare-model-2" aria-label="Select second model">
                    <option value="">Select Model 2</option>
                </select>
                <button id="compare-btn" disabled>Compare</button>
            </div>
            <div id="comparison-result" class="comparison-result" hidden></div>
        </section>

        <section class="timeline-section">
            <h2>Timeline</h2>
            <div class="timeline" id="timeline" role="list">
                <!-- Timeline nodes will be generated by JavaScript -->
            </div>
        </section>

        <section class="chart-section">
            <h2>Parameter Growth Over Time</h2>
            <div class="chart-container">
                <canvas id="growth-chart" aria-label="Parameter growth chart"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 GPT Model Timeline. Built with vanilla HTML, CSS, and JavaScript.</p>
            <p>
                <a href="https://github.com/serenakeyitan/gpt-model-timeline" target="_blank" rel="noopener">View on GitHub</a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
